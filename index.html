<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>NSURD</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#14161c;--panel:#23262f;--panel2:#2e323d;--fg:#f4f5f8;--muted:#9aa0b0;--line:rgba(255,255,255,.16);--acc:#4da6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px;padding-top:env(safe-area-inset-top)}
#top .t{font-weight:800;letter-spacing:.04em;font-size:14px;color:var(--muted)}
.ibtn{width:42px;height:42px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:20px;border:1px solid var(--line)}
.ibtn svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#mid{flex:1;min-height:0;display:grid;place-items:center;position:relative}
#stage{position:relative;background:#000;overflow:hidden;border-radius:6px;touch-action:pan-y}
#stage>canvas.l{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#bg{display:none}
#tag{position:absolute;right:0;bottom:0;pointer-events:none}
#opt{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(20,22,28,.72);border:2px solid #fff;display:grid;place-items:center;font-size:11px;font-weight:700;line-height:1.05;text-align:center;backdrop-filter:blur(4px)}
#opt b{display:block;font-size:15px}
#vol{position:absolute;left:8px;top:50%;width:110px;transform:translateY(-50%) rotate(-90deg);transform-origin:left center;margin-left:14px;display:none}
#recbadge{position:absolute;left:10px;top:10px;padding:4px 10px;border-radius:99px;background:rgba(220,40,60,.9);font-weight:700;font-size:13px}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:90%;padding:8px 14px;border-radius:12px;background:rgba(20,22,28,.85);border:1px solid var(--line);text-align:center;font-size:14px;pointer-events:none;z-index:5}
#bottom{flex:none;height:170px;padding-bottom:env(safe-area-inset-bottom);position:relative}
#car{position:absolute;left:0;right:0;top:14px;height:96px;display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x}
#car::before,#car::after{content:"";flex:none;width:calc(50% - 45px)}
#car::-webkit-scrollbar{display:none}
.it{flex:none;width:64px;height:64px;margin:0 7px;border-radius:50%;scroll-snap-align:center;position:relative;transition:transform .15s,opacity .15s;opacity:.85;background:#3a4052;overflow:hidden}
.it canvas{width:100%;height:100%;display:block}
.it.sel{transform:scale(1.2);opacity:1}
.it.add{background:var(--panel2);display:grid;place-items:center;font-size:30px;font-weight:300}
#ring{position:absolute;left:50%;top:14px;width:84px;height:84px;margin-left:-42px;margin-top:6px;border-radius:50%;border:4px solid #fff;pointer-events:none;transition:border-color .2s,transform .2s}
#ring.rec{border-color:#ff3b4e;transform:scale(1.12)}
#hint{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));text-align:center;color:var(--muted);font-size:12.5px}
#fname{position:absolute;left:0;right:0;top:112px;text-align:center;font-weight:700;font-size:13px}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -8px 30px rgba(0,0,0,.5);max-height:80vh;overflow:auto}
.sheet h3{margin:0 0 10px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.pill{min-height:40px;padding:0 14px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-weight:600}
.pill.on{background:var(--acc);border-color:var(--acc);color:#05213d}
.btn{min-height:46px;padding:0 20px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:700}
.btn.main{background:var(--acc);border-color:var(--acc);color:#05213d}
.btn.red{background:#b3263a;border-color:#b3263a}
.lbl{font-size:12.5px;color:var(--muted);margin:8px 0 2px;display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--acc)}
#start{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;place-items:center;padding:24px}
#start .card{display:grid;gap:16px;justify-items:center;text-align:center;max-width:360px}
#start p{margin:0;color:var(--muted)}
#logo{width:240px;height:auto}
#go{min-width:200px;min-height:54px;font-size:18px}
#editor{position:static;flex:none;max-height:46vh;overflow:auto;border-radius:18px 18px 0 0;box-shadow:none;z-index:1}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:19}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="ibtn" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <div class="t">NSURD</div>
    <button class="ibtn" id="flip" aria-label="Flip camera"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg></button>
  </div>
  <div id="mid">
    <div id="stage">
      <canvas class="l" id="cam"></canvas>
      <canvas class="l" id="bg"></canvas>
      <canvas class="l" id="pt"></canvas>
      <canvas class="l" id="gl"></canvas>
      <canvas class="l" id="fg"></canvas>
      <canvas id="tag" width="10" height="10"></canvas>
      <button id="opt" hidden aria-label="Filter option"></button>
      <input type="range" id="vol" min="0" max="100" value="35" aria-label="Music volume">
      <div id="recbadge" hidden>REC 0s</div>
      <div id="toast" hidden></div>
    </div>
  </div>
  <div id="editor" class="sheet" hidden></div>
  <div id="bottom">
    <div id="car" role="listbox" aria-label="Filters"></div>
    <div id="ring"></div>
    <div id="fname"></div>
    <div id="hint">Swipe for filters · Tap = photo · Hold = video</div>
  </div>
</div>

<video id="video" playsinline muted autoplay style="position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none"></video>

<div id="start">
  <div class="card">
    <canvas id="logo" width="480" height="150"></canvas>
    <p>Live face filters. No account, no sign-in. Everything stays on your phone.</p>
    <button class="btn main" id="go" type="button">Start</button>
    <p id="startmsg" style="font-size:13px"></p>
  </div>
</div>

<div id="shade" hidden></div>
<div id="settings" class="sheet" hidden>
  <h3>Settings</h3>
  <div class="lbl">Shape</div>
  <div class="row" id="fmtRow"><button class="pill" data-fmt="1:1">1:1 square</button><button class="pill" data-fmt="4:5">4:5</button><button class="pill" data-fmt="9:16">9:16 tall</button></div>
  <div class="lbl">Quality</div>
  <div class="row" id="qualRow"><button class="pill" data-q="lite">Lite (smoother)</button><button class="pill" data-q="std">High (sharper)</button></div>
  <div class="lbl">Your own filters</div>
  <div class="row"><button class="pill" id="manage">Manage saved filters</button><button class="pill" id="dbg">Face points: Off</button></div>
  <p style="color:var(--muted);font-size:12.5px;margin:4px 0 10px">Tip: in Chrome's menu choose "Add to Home screen" to open NSURD like an app. After the first load it works offline.</p>
  <button class="btn" id="closeSettings" style="width:100%">Done</button>
</div>


<script type="module">

import * as THREE from "three";
import { FaceLandmarker, FilesetResolver, ImageSegmenter } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const FACE_MODEL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
const SEG_MODEL = "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite";
const TAU = Math.PI * 2, PI = Math.PI;
const DEMO = /[?&]demo/.test(location.search);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const $ = (id) => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);

const video = $("video"), stage = $("stage"), cam = $("cam"), bgCv = $("bg"), ptCv = $("pt"), glCv = $("gl"), fgCv = $("fg"), tagCv = $("tag");
const camCtx = cam.getContext("2d"), bgCtx = bgCv.getContext("2d"), ptCtx = ptCv.getContext("2d"), fgCtx = fgCv.getContext("2d"), tagCtx = tagCv.getContext("2d");
const moonCv = document.createElement("canvas");
const pcCv = document.createElement("canvas"), pcCtx = pcCv.getContext("2d");
const maskCv = document.createElement("canvas"), maskCtx = maskCv.getContext("2d");
const recCv = document.createElement("canvas"), recCtx = recCv.getContext("2d");
let maskImg = null;

/* ---------------- state ---------------- */
const FMT = { "1:1": 1, "4:5": 0.8, "9:16": 9 / 16 };
const AREA = { lite: 480 * 480, std: 720 * 720 };
let quality = "lite", fmt = "1:1";
let W = 0, H = 0, facing = "user";
let stream = null, landmarker = null, fileset = null, segmenter = null, running = false;
let maskReady = false, personHigh = true, segFrame = 0, moonOn = false;
let recording = false, recorder = null, chunks = [], recStart = 0, recTimer = 0, shotPending = false;
let debugPts = false;
let actx = null, recDest = null, micStream = null;
try { const s = JSON.parse(localStorage.getItem("nsurd.prefs") || "{}"); if (FMT[s.fmt]) fmt = s.fmt; if (s.quality === "std" || s.quality === "lite") quality = s.quality; } catch (e) { /* ignore */ }
function savePrefs() { try { localStorage.setItem("nsurd.prefs", JSON.stringify({ fmt, quality })); } catch (e) { /* ignore */ } }

const stageToast = $("toast");
let toastTimer = 0;
function say(msg, ms) {
  clearTimeout(toastTimer);
  stageToast.textContent = msg; stageToast.hidden = false;
  if (ms !== 0) toastTimer = setTimeout(() => { stageToast.hidden = true; }, ms || 2200);
}

/* ---------------- face landmark index lists ---------------- */
const OVAL = [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109];
const LIPS_O = [61, 146, 91, 181, 84, 17, 314, 405, 321, 375, 291, 409, 270, 269, 267, 0, 37, 39, 40, 185];
const LIPS_I = [78, 95, 88, 178, 87, 14, 317, 402, 318, 324, 308, 415, 310, 311, 312, 13, 82, 81, 80, 191];
const EYE_A = [33, 7, 163, 144, 145, 153, 154, 155, 133, 173, 157, 158, 159, 160, 161, 246];
const EYE_B = [263, 249, 390, 373, 374, 380, 381, 382, 362, 398, 384, 385, 386, 387, 388, 466];
const BROW_A = [70, 63, 105, 66, 107, 55, 65, 52, 53, 46];
const BROW_B = [300, 293, 334, 296, 336, 285, 295, 282, 283, 276];

/* ---------------- per-frame state shared by all filters ---------------- */
const F = {
  lm: null, face: false, now: 0, t: 0, dt: 0.016, W: 0, H: 0, opt: 0,
  cx: 0, cy: 0, eye: 100, roll: 0, yaw: 0, pitch: 0, fx: 0, fy: 0,
  mouth: { x: 0, y: 0, open: 0, pucker: 0 }, blinkA: 0, blinkB: 0,
  faceW: 200, faceH: 260, omegaPitch: 0, omegaYaw: 0
};
const pose = { x: 0, y: 0, s: 100, q: new THREE.Quaternion(), pitch: 0, yaw: 0, omegaPitch: 0, omegaYaw: 0 };
let faceT = 0;
const px = (i) => F.lm[i].x * W;
const py = (i) => F.lm[i].y * H;
function poly(c, idx) { // draw a closed path through landmark indices (call beginPath yourself)
  const lm = F.lm;
  c.moveTo(lm[idx[0]].x * W, lm[idx[0]].y * H);
  for (let i = 1; i < idx.length; i++) c.lineTo(lm[idx[i]].x * W, lm[idx[i]].y * H);
  c.closePath();
}
/* smooth closed path through landmark points (for rounder shapes) */
function smoothPoly(c, idx) {
  const lm = F.lm, n = idx.length;
  const pt = (k) => lm[idx[(k + n) % n]];
  c.moveTo(((pt(0).x + pt(1).x) / 2) * W, ((pt(0).y + pt(1).y) / 2) * H);
  for (let i = 1; i <= n; i++) {
    const a = pt(i), b = pt(i + 1);
    c.quadraticCurveTo(a.x * W, a.y * H, ((a.x + b.x) / 2) * W, ((a.y + b.y) / 2) * H);
  }
  c.closePath();
}
/* clip to the face oval and (optionally) cut out eyes / mouth so they stay visible */
function clipFace(c, holes) {
  c.beginPath(); smoothPoly(c, OVAL);
  if (holes) { poly(c, EYE_A); poly(c, EYE_B); poly(c, LIPS_O); }
  c.clip(holes ? "evenodd" : "nonzero");
}
/* put the canvas origin at the face: units are "eye distances", rotated with the head roll */
function faceSpace(c, ox, oy) {
  c.translate(F.cx + (ox || 0), F.cy + (oy || 0));
  c.rotate(F.roll);
  c.scale(F.eye, F.eye);
}

/* ---------------- three.js scene ---------------- */
const renderer = new THREE.WebGLRenderer({ canvas: glCv, alpha: true, antialias: false, powerPreference: "high-performance", preserveDrawingBuffer: false });
renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(0, 1, 0, -1, 0.1, 4000);
camera.position.z = 2000;
const ambient = new THREE.AmbientLight(0xffffff, 1.1);
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(0.5, 1, 1);
scene.add(ambient, sun);
const root = new THREE.Group();     // follows the head: origin = midpoint between the eyes, 1 unit = eye distance
const world = new THREE.Group();    // screen-space objects: 1 unit = 1 pixel
scene.add(root, world);
{
  const occ = new THREE.MeshBasicMaterial({ colorWrite: false });
  const head = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 18), occ);
  head.scale.set(0.82, 1.15, 0.95); head.position.set(0, -0.1, -0.45); head.renderOrder = -10;
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.55, 1.7, 16), occ);
  neck.position.set(0, -1.6, -0.5); neck.renderOrder = -10;
  root.userData.occ = new THREE.Group(); root.userData.occ.add(head, neck);
  root.add(root.userData.occ);
}

/* small three.js helpers used by the filter models */
const std = (c, o) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.55, metalness: 0 }, o || {}));
const bas = (c, o) => new THREE.MeshBasicMaterial(Object.assign({ color: c }, o || {}));
function mk(geo, mat, x, y, z) { const o = new THREE.Mesh(geo, mat); o.position.set(x || 0, y || 0, z || 0); return o; }
function sc(o, x, y, z) { o.scale.set(x, y === undefined ? x : y, z === undefined ? x : z); return o; }
function rot(o, x, y, z) { o.rotation.set(x || 0, y || 0, z || 0); return o; }
function grp(...kids) { const g = new THREE.Group(); kids.forEach((k) => g.add(k)); return g; }
const sph = (r, a, b) => new THREE.SphereGeometry(r, a || 20, b || 14);
function canvasTex(w, h, fn) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  fn(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  return t;
}
function tex(c) { return new THREE.CanvasTexture(c); }

/* ---------------- sizing ---------------- */
function computeSize() {
  const ar = FMT[fmt];
  const w = Math.round(Math.sqrt(AREA[quality] * ar) / 2) * 2;
  const h = Math.round(w / ar / 2) * 2;
  return [w, h];
}
function fit() {
  if (!W) return;
  const mid = $("mid");
  const aw = mid.clientWidth - 8, ah = mid.clientHeight - 4;
  const s = Math.min(aw / W, ah / H);
  stage.style.width = Math.floor(W * s) + "px"; stage.style.height = Math.floor(H * s) + "px";
  const k = W / 480;
  tagCv.style.width = Math.round(TAG_W * k * s) + "px"; tagCv.style.height = Math.round(TAG_H * k * s) + "px";
  tagCv.style.right = Math.round(10 * k * s) + "px"; tagCv.style.bottom = Math.round(10 * k * s) + "px";
}
addEventListener("resize", fit);
addEventListener("orientationchange", () => setTimeout(fit, 300));

/* NSURD tag: gray badge, rainbow letters (my own lettering) */
const TAG_W = 118, TAG_H = 40;
function drawTagAt(c, x, y, k) {
  c.save(); c.translate(x, y); c.scale(k, k);
  const g = c.createLinearGradient(0, 0, 0, TAG_H);
  g.addColorStop(0, "#6b7080"); g.addColorStop(1, "#464b59");
  c.fillStyle = g; c.beginPath();
  if (c.roundRect) c.roundRect(0, 0, TAG_W, TAG_H, 9); else c.rect(0, 0, TAG_W, TAG_H);
  c.fill();
  c.strokeStyle = "rgba(255,255,255,.28)"; c.lineWidth = 1.2; c.stroke();
  const cols = ["#ff4d57", "#ff9f1a", "#ffe44d", "#46dc6e", "#4da8ff"];
  c.font = "italic 900 25px 'Trebuchet MS','Arial Rounded MT Bold',Arial,sans-serif";
  c.textBaseline = "middle"; c.textAlign = "left";
  const word = "NSURD"; let wd = 0; const ws = [];
  for (let i = 0; i < 5; i++) { ws[i] = c.measureText(word[i]).width + 1.5; wd += ws[i]; }
  let x0 = (TAG_W - wd) / 2 + 1;
  c.lineJoin = "round"; c.lineWidth = 3.2; c.strokeStyle = "rgba(20,22,30,.9)";
  for (let i = 0; i < 5; i++) {
    c.strokeText(word[i], x0, TAG_H / 2 + 1.5); c.fillStyle = cols[i]; c.fillText(word[i], x0, TAG_H / 2 + 1.5); x0 += ws[i];
  }
  c.restore();
}
function paintTag() {
  const k = W / 480;
  tagCv.width = Math.round(TAG_W * k); tagCv.height = Math.round(TAG_H * k);
  drawTagAt(tagCtx, 0, 0, k);
}
function drawLogo() {
  const c = $("logo").getContext("2d"); c.clearRect(0, 0, 480, 150);
  const k = 3.6; drawTagAt(c, (480 - TAG_W * k) / 2, (150 - TAG_H * k) / 2, k);
}

function setSize() {
  [W, H] = computeSize();
  F.W = W; F.H = H;
  [cam, bgCv, ptCv, fgCv, pcCv, recCv].forEach((c) => { c.width = W; c.height = H; });
  renderer.setSize(W, H, false);
  camera.left = 0; camera.right = W; camera.top = 0; camera.bottom = -H;
  camera.updateProjectionMatrix();
  drawMoon(); paintTag(); fit();
  maskReady = false; faceT = 0;
}

/* moon backdrop for the Moonwalker filter */
function drawMoon() {
  moonCv.width = W; moonCv.height = H;
  const c = moonCv.getContext("2d");
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#070a1c"); g.addColorStop(0.7, "#1a2150"); g.addColorStop(1, "#252c63");
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  let seed = 7; const r = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  for (let i = 0; i < 110; i++) {
    c.fillStyle = "rgba(255,255,255," + (0.35 + r() * 0.65) + ")";
    c.beginPath(); c.arc(r() * W, r() * H * 0.8, 0.5 + r() * 1.6, 0, TAU); c.fill();
  }
  const m = Math.min(W, H), ppx = W * 0.2, ppy = H * 0.17, pr = m * 0.11;

/* ================= 2D face paint and screen effects =================
   paint(c, F) draws under the 3D layer, over(c, F) above it. Both use canvas pixels. */
function byId(id) { return FILTERS.find((f) => f.id === id); }
function ext(id, props) { Object.assign(byId(id), props); }
function seeded(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return s / 2147483647; }; }
function ellipse(c, x, y, rx, ry, r) { c.beginPath(); c.ellipse(x, y, rx, ry, r || 0, 0, TAU); }
function heart(c, x, y, s, r, col) {
  c.save(); c.translate(x, y); c.rotate(r); c.scale(s, s); c.fillStyle = col; c.beginPath();
  c.moveTo(0, 0.35); c.bezierCurveTo(-1, -0.3, -0.55, -1, 0, -0.45); c.bezierCurveTo(0.55, -1, 1, -0.3, 0, 0.35); c.fill(); c.restore();
}
function star5(c, x, y, r, rotA) {
  c.beginPath();
  for (let i = 0; i < 10; i++) { const a = rotA + (i * PI) / 5 - PI / 2, rad = i % 2 ? r * 0.42 : r; c.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  c.closePath();
}
function lipPrint(c, x, y, s, r) {
  c.save(); c.translate(x, y); c.rotate(r); c.scale(s, s); c.fillStyle = "rgba(214,28,70,.88)"; c.beginPath();
  c.moveTo(-1, 0); c.quadraticCurveTo(-0.6, -0.55, -0.2, -0.35); c.quadraticCurveTo(0, -0.2, 0.2, -0.35); c.quadraticCurveTo(0.6, -0.55, 1, 0);
  c.quadraticCurveTo(0.6, 0.7, 0, 0.75); c.quadraticCurveTo(-0.6, 0.7, -1, 0); c.fill();
  c.strokeStyle = "rgba(120,10,40,.5)"; c.lineWidth = 0.06; c.beginPath(); c.moveTo(-1, 0); c.quadraticCurveTo(0, 0.2, 1, 0); c.stroke(); c.restore();
}
/* tapered stripe in face space */
function stripe(c, x0, y0, x1, y1, w, col) {
  const dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy) || 1, nx = -dy / l, ny = dx / l, mx = (x0 + x1) / 2 + nx * w * 0.25, my = (y0 + y1) / 2 + ny * w * 0.25;

(function () {
  const st = [{ x: 0, y: 0, vx: 0, vy: 0 }, { x: 0, y: 0, vx: 0, vy: 0 }];
  let pcx = 0, pcy = 0;
  reg({
    id: "crazyeyes", name: "Crazy eyes", opts: ["Googly", "Spiral"],
    over(c, f) {
      const R = f.eye * 0.4, pr = R * 0.45, dcx = f.cx - pcx, dcy = f.cy - pcy; pcx = f.cx; pcy = f.cy;
      [irisA(), irisB()].forEach((p, i) => {
        c.save(); c.translate(p.x, p.y);
        c.fillStyle = "rgba(0,0,0,.25)"; c.beginPath(); c.arc(R * 0.06, R * 0.1, R * 1.04, 0, TAU); c.fill();
        c.fillStyle = "#fff"; c.strokeStyle = "#16161a"; c.lineWidth = R * 0.12; c.beginPath(); c.arc(0, 0, R, 0, TAU); c.fill(); c.stroke();
        if (f.opt === 1) {
          c.strokeStyle = "#16161a"; c.lineWidth = R * 0.1; c.lineCap = "round"; c.beginPath();
          const ph = f.t * 5 * (i ? -1 : 1);
          for (let a = 0; a < 5.6 * PI; a += 0.15) { const r = (a / (5.6 * PI)) * R * 0.85; const x = Math.cos(a + ph) * r, y = Math.sin(a + ph) * r; if (a === 0) c.moveTo(x, y); else c.lineTo(x, y); }
          c.stroke();
        } else {
          const s = st[i]; s.vx += -dcx * 0.6 + rnd(-8, 8) * 0.03; s.vy += 1500 * f.dt - dcy * 0.6 + rnd(-8, 8) * 0.03;
          s.vx *= 0.985; s.vy *= 0.985; s.x += s.vx * f.dt; s.y += s.vy * f.dt;
          const lim = R - pr - R * 0.08, d = Math.hypot(s.x, s.y);
          if (d > lim) { const nx = s.x / d, ny = s.y / d; s.x = nx * lim; s.y = ny * lim; const vn = s.vx * nx + s.vy * ny; if (vn > 0) { s.vx -= 1.6 * vn * nx; s.vy -= 1.6 * vn * ny; } }
          c.fillStyle = "#101014"; c.beginPath(); c.arc(s.x, s.y, pr, 0, TAU); c.fill();
          c.fillStyle = "rgba(255,255,255,.8)"; c.beginPath(); c.arc(s.x - pr * 0.3, s.y - pr * 0.3, pr * 0.22, 0, TAU); c.fill();
        }
        c.restore();
      });
    }
  });
})();

/* ================= original disco groove (Web Audio, no samples, no real songs) ================= */
const disco = (function () {
  let master = null, timer = 0, step = 0, nextT = 0, playing = false, vol = 0.35, noiseBuf = null;
  const BPM = 118, S = 60 / BPM / 4;
  const ROOTS = [57, 50, 55, 48]; // A2 D2 G2 C2 style bass roots (MIDI)
  const CHORDS = [[69, 72, 76], [62, 65, 69], [67, 71, 74], [60, 64, 67]];
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function ensure() {
    if (master || !actx) return;
    master = actx.createGain(); master.gain.value = 0;
    master.connect(actx.destination);
    if (recDest) master.connect(recDest);
    const len = actx.sampleRate * 0.5; noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function env(g, t, a, d, peak) { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
  function kick(t) {
    const o = actx.createOscillator(), g = actx.createGain(); o.type = "sine";
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12); env(g, t, 0.003, 0.28, 0.9);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.32);
  }
  function noise(t, hp, dur, peak) {
    const n = actx.createBufferSource(); n.buffer = noiseBuf; const f = actx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp;
    const g = actx.createGain(); env(g, t, 0.002, dur, peak); n.connect(f); f.connect(g); g.connect(master); n.start(t); n.stop(t + dur + 0.05);
  }
  function bass(t, midi, len) {
    const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain(); o.type = "sawtooth"; o.frequency.value = hz(midi);
    f.type = "lowpass"; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(220, t + len); env(g, t, 0.005, len, 0.38);
    o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + len + 0.05);
  }
  function stab(t, notes) {
    notes.forEach((m, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter(); o.type = i % 2 ? "square" : "sawtooth"; o.frequency.value = hz(m);
      f.type = "lowpass"; f.frequency.value = 2400; env(g, t, 0.004, 0.14, 0.11); o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + 0.2);
    });
  }
  function schedule() {
    while (nextT < actx.currentTime + 0.14) {
      const s = step % 16, bar = ((step / 16) | 0) % 4, t = nextT;
      if (s % 4 === 0) kick(t);
      if (s % 4 === 2) noise(t, 7000, 0.06, 0.22);
      if (s === 4 || s === 12) { noise(t, 1500, 0.12, 0.3); }
      if (s % 2 === 0) bass(t, ROOTS[bar] + (s % 4 === 2 ? 12 : 0), S * 1.6);
      if (s === 3 || s === 6 || s === 11 || s === 14) stab(t, CHORDS[bar]);
      nextT += S; step++;
    }
  }
  return {
    start() {
      if (!actx) return; ensure(); if (playing) return;
      if (actx.state === "suspended") actx.resume();
      playing = true; step = 0; nextT = actx.currentTime + 0.08;
      master.gain.cancelScheduledValues(actx.currentTime); master.gain.setTargetAtTime(vol * 0.55, actx.currentTime, 0.05);
      timer = setInterval(schedule, 30);
    },
    stop() {
      if (!playing) return; playing = false; clearInterval(timer);
      if (master) master.gain.setTargetAtTime(0, actx.currentTime, 0.04);
    },
    setVolume(v) { vol = v; if (master && playing) master.gain.setTargetAtTime(vol * 0.55, actx.currentTime, 0.05); },
    get playing() { return playing; }
  };
})();

/* ================= your own filters (saved on the device in IndexedDB) ================= */
const ANCHORS = [["head", "Top of head"], ["eyes", "Eyes"], ["nose", "Nose"], ["mouth", "Mouth"], ["face", "Whole face"]];
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("nsurd", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("filters", { keyPath: "id" });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function dbAll() { const d = await idb(); return new Promise((res, rej) => { const q = d.transaction("filters").objectStore("filters").getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function dbPut(rec) { const d = await idb(); return new Promise((res, rej) => { const tx = d.transaction("filters", "readwrite"); tx.objectStore("filters").put(rec); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
async function dbDel(id) { const d = await idb(); return new Promise((res, rej) => { const tx = d.transaction("filters", "readwrite"); tx.objectStore("filters").delete(id); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }

function loadBlobImage(blob) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob), im = new Image();
    im.onload = () => { res(im); }; im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("bad image")); }; im.src = url;
  });
}
/* shrink big pictures so they stay fast and small on the phone */
async function normalizeImage(file) {
  const im = await loadBlobImage(file);
  const k = Math.min(1, 512 / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));
  c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, "image/png"));
  return blob;
}

/* ---- flat mode ---- */
function drawFlat(c, f, rec, img) {
  const s = rec.scale, e = f.eye, ar = img.naturalHeight / img.naturalWidth;
  let ax, ay, w, bottom = false;
  if (rec.anchor === "head") { ax = px(10); ay = py(10); w = 1.7 * e * s; bottom = true; }
  else if (rec.anchor === "eyes") { ax = f.cx; ay = f.cy; w = 2.3 * e * s; }
  else if (rec.anchor === "nose") { ax = px(1); ay = py(1); w = 0.9 * e * s; }
  else if (rec.anchor === "mouth") { ax = f.mouth.x; ay = f.mouth.y; w = 1.2 * e * s; }
  else { ax = (px(10) + px(152)) / 2; ay = (py(10) + py(152)) / 2; w = f.faceW * 1.15 * s; }
  const h = w * ar;
  c.save(); c.translate(ax, ay); c.rotate(f.roll); c.translate(rec.dx * e, rec.dy * e);
  c.scale(Math.max(0.5, Math.cos(f.yaw * 0.9)), 1);
  c.drawImage(img, -w / 2, bottom ? -h : -h / 2, w, h);
  c.restore();
}

let lastT = 0, lastVT = -1, detFrame = 0, started = false;
function frame(now) {
  requestAnimationFrame(frame);

  if (!DEMO && video.readyState < 2) return;
  const dt = Math.min(0.1, (now - lastT) / 1000 || 0.016); lastT = now;
  if (DEMO) {
    const res = fakeFace(now / 1000, now); updatePose(res, dt, now); faceT = now;
  } else if (video.currentTime !== lastVT) {
    lastVT = video.currentTime; grabFrame(); detFrame++;
    {
      const res = landmarker.detectForVideo(cam, now);
      if (res.faceLandmarks && res.faceLandmarks.length) { updatePose(res, dt, now); faceT = now; }
    }
    segFrame++; if (moonOn && segmenter && segFrame % 2 === 0) runSeg(now);
  }
  F.face = !!F.lm && now - faceT < 250; F.now = now; F.t = now / 1000; F.dt = dt; F.W = W; F.H = H; F.opt = optIndex(cur);
  ptCtx.clearRect(0, 0, W, H); fgCtx.clearRect(0, 0, W, H);
  const f = cur;
  let live = false;
  if (f) {
    if (f.paint && (F.face || f.alwaysPaint)) { ptCtx.save(); f.paint(ptCtx, F); ptCtx.restore(); }
    if (f._b) {
      live = F.face;
      f._b.group.visible = live; if (f._b.world) f._b.world.visible = true;
      if (live) { root.position.set(pose.x, -pose.y, 0); root.quaternion.copy(pose.q); root.scale.setScalar(pose.s); }
      if (f._b.tick) f._b.tick(F);
    }
    if (f.over && (F.face || f.alwaysOver)) { fgCtx.save(); f.over(fgCtx, F); fgCtx.restore(); }
  }
  root.visible = live;
  if (debugPts && F.face) { fgCtx.save(); fgCtx.fillStyle = "#00ff66"; [OVAL, EYE_A, EYE_B, LIPS_O].forEach((l) => l.forEach((i) => { fgCtx.fillRect(px(i) - 1.5, py(i) - 1.5, 3, 3); })); fgCtx.fillStyle = "#ff3b3b"; fgCtx.fillRect(px(1) - 2, py(1) - 2, 4, 4); fgCtx.restore(); }

/* ================= start, settings, init ================= */
function refreshSettings() {
  document.querySelectorAll("#fmtRow [data-fmt]").forEach((b) => b.classList.toggle("on", b.dataset.fmt === fmt));
  document.querySelectorAll("#qualRow [data-q]").forEach((b) => b.classList.toggle("on", b.dataset.q === quality));
}
function openSheet(id) { $("shade").hidden = false; $(id).hidden = false; refreshSettings(); }
function closeSheets() { $("shade").hidden = true; $("settings").hidden = true; }
$("gear").addEventListener("click", () => openSheet("settings"));
$("closeSettings").addEventListener("click", closeSheets);
$("shade").addEventListener("click", closeSheets);
$("dbg").addEventListener("click", () => { debugPts = !debugPts; $("dbg").classList.toggle("on", debugPts); $("dbg").textContent = "Face points: " + (debugPts ? "On" : "Off"); });
$("manage").addEventListener("click", () => { closeSheets(); openManage(); });
document.querySelectorAll("#fmtRow [data-fmt]").forEach((b) => b.addEventListener("click", () => {
  if (recording) { say("Stop recording first."); return; }
  fmt = b.dataset.fmt; savePrefs(); REF = null; setSize(); refreshSettings();
}));
document.querySelectorAll("#qualRow [data-q]").forEach((b) => b.addEventListener("click", () => {
  if (recording) { say("Stop recording first."); return; }
  quality = b.dataset.q; savePrefs(); setSize(); refreshSettings();
}));
$("flip").addEventListener("click", async () => {
  if (recording) { say("Stop recording first."); return; }
  if (DEMO) return;
  facing = facing === "user" ? "environment" : "user";
  try { await startCamera(); } catch (e) { facing = facing === "user" ? "environment" : "user"; say("That camera is not available."); try { await startCamera(); } catch (_) { /* give up */ } }
});

$("go").addEventListener("click", async () => {
  const go = $("go"); go.disabled = true; const msg = $("startmsg");
  try {
    if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) { actx = new AC(); recDest = actx.createMediaStreamDestination(); } }
    if (actx && actx.state === "suspended") actx.resume();
    if (!DEMO) {
      if (!window.isSecureContext) throw new Error("insecure");
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("nocam");
      msg.textContent = "Starting camera..."; await startCamera();
      msg.textContent = "Loading face tracking (first time takes a moment)..."; await initModels();
    }
  } catch (e) {
    go.disabled = false; const n = e && e.name, m = e && e.message;
    if (m === "insecure") msg.textContent = "The camera needs a secure page (https).";
    else if (n === "NotAllowedError") msg.textContent = "Camera access was blocked. Allow the camera for this page and try again.";
    else if (n === "NotFoundError") msg.textContent = "No camera was found on this device.";
    else msg.textContent = "Could not start: " + (m || n || "unknown error");
    return;
  }
  $("start").hidden = true;
  setSize(); running = true;
  if (!started) { started = true; requestAnimationFrame(frame); }
  say("Swipe left or right to change filters", 2600);
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => { /* offline mode is optional */ });
});

(async function init() {
  drawLogo();
  await loadCustoms();
  buildCarousel();
  requestAnimationFrame(() => { goTo(0, false); selIdx = -1; setSel(0); });
  addEventListener("resize", () => { if (items.length) goTo(selIdx, false); });
  window.__nsurd = { FILTERS, LIST, get cur() { return cur; }, select(id) { const i = items.findIndex((it) => it.f && it.f.id === id); goTo(i, false); setSel(i); }, F };
})();

</script>
</body>
</html>
